name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saklolo161-backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./saklolo161-backend
        run: npm ci

      - name: Structure guard
        working-directory: .
        run: |
          test -f saklolo161-backend/server.js
          test -f saklolo161-backend/package.json
          test -f saklolo161-backend/routes/authRoutes.js
          test -f saklolo161-backend/middlewares/rateLimitIncidents.js
          test ! -f server.js
          test ! -f package.json

      # Firebase configuration comes ONLY from repository secrets —
      # never hardcoded. Create these in Settings -> Secrets and
      # variables -> Actions before this workflow can pass:
      #   FIREBASE_CREDENTIALS_JSON  (service-account JSON, single line)
      #   FIREBASE_DATABASE_URL      (RTDB instance URL)
      #   FIREBASE_WEB_API_KEY       (Firebase Auth web API key)
      # The suite also expects the 5 staff accounts to be provisioned
      # and /stations seeded in that Firebase project (one-time,
      # local: node scripts/provisionUser.js / node scripts/seedStations.js).
      - name: Contract tests
        working-directory: ./saklolo161-backend
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: npm test

      - name: Boot and auth smoke test
        working-directory: ./saklolo161-backend
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          PORT=5999 node server.js & SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:5999/ > /dev/null
          # Smoke login uses the same seeded staff account the contract
          # suite authenticates with on every CI run (flood@). The legacy
          # admin@ account still exists in Firebase Auth, but its password
          # no longer matches the shared dev password, so it 401s here.
          TOKEN=$(curl -s -X POST http://localhost:5999/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"flood@marikina.gov.ph","password":"changeme123"}' \
            | node -pe "JSON.parse(require('fs').readFileSync(0)).data.token")
          test -n "$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:5999/api/incidents > /dev/null
          kill $SERVER_PID